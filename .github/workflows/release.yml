# Manual release: Actions tab -> Release -> Run workflow.
# Consumes pending changesets, pushes version bumps ([skip ci]), publishes changed packages.
#
# Publishing uses npm Trusted Publishing (OIDC) — there is NO NPM_TOKEN secret.
# Every published package must have a Trusted Publisher configured on npmjs.com:
#   Organization/user: Mrpunyapal · Repository: laravel-client-validation
#   Workflow filename: release.yml · Allowed action: npm publish
name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'beta = throwaway core publish to verify OIDC; full = normal release'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - beta

permissions:
  contents: write
  id-token: write # mints the short-lived OIDC credential npm exchanges at publish time

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # no registry-url here: setting one makes setup-node export a dummy
          # NODE_AUTH_TOKEN, which stops npm from using OIDC trusted publishing

      - name: Ensure npm supports OIDC publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version packages from changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')
          if [ -n "$pending" ]; then
            npx changeset version
          else
            echo "No pending changesets — publishing current manifest versions."
          fi

      - name: Commit version bumps
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore: version packages [skip ci]"
            # build-docs may have committed regenerated output meanwhile; rebase over it
            git pull --rebase origin main
            git push
          else
            echo "No pending changesets — nothing to version."
          fi

      - name: Publish changed packages to npm
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          # Detach the npm workspace definition: while present, any pack/publish
          # resolves the whole monorepo tree and fails on sibling ranges that pin
          # versions not yet uploaded (e.g. core ^0.1.1 during a fresh release).
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('package.json','utf8'));delete m.workspaces;fs.writeFileSync('package.json',JSON.stringify(m,null,2)+'\n')"
          npm run build
          if [ "${{ inputs.mode }}" = "beta" ]; then
            # Throwaway OIDC verification: core only, beta tag, verbose logs so
            # npm's silent oidc() failures become visible.
            echo "=== JWT claims npm sends to the registry ==="
            jwt=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).value))")
            node -e "
              const [h,p] = process.argv[1].split('.');
              const claims = JSON.parse(Buffer.from(p,'base64').toString('utf8'));
              const keep = ['repository','repository_owner','workflow','job_workflow_ref','ref','environment'];
              for (const k of keep) console.log(k+':', JSON.stringify(claims[k] ?? null));
            " "$jwt"
            cd packages/js/core
            npm version "0.0.0-beta.${{ github.run_number }}" --no-git-tag-version
            exec npm publish --provenance --access public --tag beta --loglevel=silly
          fi
          # changeset publish does not propagate the OIDC environment to its npm
          # subprocesses (changesets#1914), so publish each package directly.
          # Provenance mode forces npm's OIDC auth exchange; the registry check
          # keeps reruns idempotent. Order matters: dependencies before dependents.
          node - <<'EOF'
          const fs = require('fs');
          const cp = require('child_process');
          const targets = [
            'packages/js/core',
            'packages/js/alpine',
            'packages/js/vanilla',
            'packages/js/livewire',
            'packages/js/react',
            'packages/js/vue',
            process.cwd(),
          ];
          for (const dir of targets) {
            const manifest = JSON.parse(fs.readFileSync(`${dir}/package.json`, 'utf8'));
            const spec = `${manifest.name}@${manifest.version}`;
            let published = false;
            try {
              cp.execSync(`npm view ${spec} version`, { stdio: 'pipe' });
              published = true;
            } catch {}
            if (published) {
              console.log(`skip ${spec} (already on npm)`);
              continue;
            }
            console.log(`publishing ${spec}`);
            cp.execSync('npm publish --provenance --access public', { cwd: dir, stdio: 'inherit' });
          }
          EOF
