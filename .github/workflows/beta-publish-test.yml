# Throwaway OIDC verification: publishes @laravel-client-validation/core under
# a 0.0.0-beta.<run_number> version with the `beta` dist-tag, so the trusted
# publishing pathway can be tested without touching real releases.
# Delete this file once the release pipeline is proven.
name: Beta publish test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Ensure npm supports OIDC publishing
        run: npm install -g npm@latest

      - name: Detach npm workspace definition
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('package.json','utf8'));delete m.workspaces;fs.writeFileSync('package.json',JSON.stringify(m,null,2)+'\n')"

      - name: Exchange OIDC for a short-lived npm token
        id: oidc
        shell: bash
        run: |
          # GitHub mints a workflow identity token bound to this repo+workflow
          jwt=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm_registry" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).value))")
          [ -n "$jwt" ] || { echo "no OIDC token minted"; exit 1; }
          # npm's RFC 8693 token exchange -> minutes-lived publish credential
          resp=$(curl -sS -X POST https://registry.npmjs.org/-/oauth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "subject_token=$jwt" \
            --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:id_token" \
            --data-urlencode "requested_token_type=urn:ietf:params:oauth:token-type:access_token")
          echo "$resp" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const j=JSON.parse(d);
              if(!j.access_token){ console.error('exchange failed:', d); process.exit(1); }
              require('fs').appendFileSync(process.env.NPMRC, 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken='+j.access_token+'\n');
              console.log('exchanged short-lived npm token (expires_in '+(j.expires_in||'?')+'s)');
            })"
        env:
          NPMRC: ${{ github.workspace }}/.npmrc-oidc

      - name: Publish core as throwaway beta
        working-directory: packages/js/core
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc-oidc
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          stage=$(mktemp -d)
          npm version "0.0.0-beta.${{ github.run_number }}" --no-git-tag-version
          npm pack --pack-destination "$stage"
          echo "publishing $(ls "$stage")"
          cd "$stage"
          npm publish *.tgz --provenance --access public --tag beta
