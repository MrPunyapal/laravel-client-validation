name: tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.6']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3
          coverage: none

      - name: Install dependencies
        if: matrix.php != '8.6'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install PHP 8.6 dependencies
        if: matrix.php == '8.6'
        run: |
          composer require --dev "pestphp/pest:^5.0" "pestphp/pest-plugin-laravel:^5.0" "pestphp/pest-plugin-arch:^5.0" "phpunit/phpunit:^13.0" --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

  php-livewire-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.6']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3
          coverage: none

      - name: Install dependencies
        working-directory: packages/php/livewire
        if: matrix.php != '8.6'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install PHP 8.6 dependencies
        if: matrix.php == '8.6'
        working-directory: packages/php/livewire
        run: |
          composer require --dev "pestphp/pest:^5.0" "pestphp/pest-plugin-laravel:^5.0" --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Run tests
        working-directory: packages/php/livewire
        run: vendor/bin/pest

  php-filament-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.6']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3
          coverage: none

      - name: Install dependencies
        working-directory: packages/php/filament
        if: matrix.php != '8.6'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install PHP 8.6 dependencies
        if: matrix.php == '8.6'
        working-directory: packages/php/filament
        run: |
          composer require --dev "pestphp/pest:^5.0" "pestphp/pest-plugin-laravel:^5.0" --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Run tests
        working-directory: packages/php/filament
        run: vendor/bin/pest

  js:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Build bundles
        run: npm run build
